name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargo el repositorio
        uses: actions/checkout@v4

      - name: Preparo Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # CDK ejecuta su motor sobre Node, así que lo dejo disponible.
      - name: Preparo Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalo dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ejecuto las pruebas
        run: python -m pytest -q
